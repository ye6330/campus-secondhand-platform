server:
  port: 9102

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.209.128:3306/trade_product_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  redis:
    host: 192.168.209.128
    port: 6379
    password: 123456
  cache:
    type: redis
  elasticsearch:
    uris: http://192.168.209.128:9200

seata:
  application-id: campus-product-service
  tx-service-group: campus_tx_group
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 192.168.209.128:8848
      namespace: ""
      group: SEATA_GROUP
      cluster: default
      username: nacos
      password: nacos
  service:
    vgroup-mapping:
      campus_tx_group: default
    grouplist:
      default: 192.168.209.128:8091

oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  bucket: aaaa-campus-trade-images
  access-key-id: YOUR_OSS_ACCESS_KEY_ID
  access-key-secret: YOUR_OSS_ACCESS_KEY_SECRET
  dir: products/

logging:
  level:
    com.campus.secondhand.product.mapper: DEBUG
