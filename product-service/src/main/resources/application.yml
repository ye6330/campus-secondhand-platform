server:
  port: 9102

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:192.168.209.128}:${DB_PORT:3306}/${DB_NAME:trade_product_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:192.168.209.128}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:123456}
  cache:
    type: redis
  elasticsearch:
    uris: http://${ES_HOST:192.168.209.128}:${ES_PORT:9200}

seata:
  application-id: campus-product-service
  tx-service-group: campus_tx_group
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_ADDR:192.168.209.128:8848}
      namespace: ""
      group: SEATA_GROUP
      cluster: default
      username: ${SEATA_NACOS_USERNAME:nacos}
      password: ${SEATA_NACOS_PASSWORD:nacos}
  service:
    vgroup-mapping:
      campus_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:192.168.209.128:8091}

oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
  bucket: ${OSS_BUCKET:aaaa-campus-trade-images}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  dir: ${OSS_DIR:products/}

logging:
  level:
    com.campus.secondhand.product.mapper: DEBUG
